<html lang="pl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2D72">
<title>Sumczykowe Mikołaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Berkshire+Swash&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #1B2D72;
    --sky-mid: #2A479C;
    --sky-low: #3558AE;
    --paper: #FFFCF4;
    --ink: #1B2440;
    --muted: #5C6785;
    --line: #E4EAF6;
    --red: #D62F45;
    --red-dark: #B8243A;
    --gold: #F7BE3E;
    --gold-soft: #FFF3CF;
    --pine: #2E8559;
    --pine-dark: #25704A;
    --snow: #F4F8FF;
    --display: "Berkshire Swash", Georgia, "Times New Roman", serif;
    --navy: #1E3279;
    --link: #2455B8;
    --link-dark: #173E8E;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-synthesis: none; -webkit-text-size-adjust: 100%; background: var(--sky-low); }
  body {
    margin: 0; color: var(--ink); font: 400 1rem/1.45 var(--body);
    min-height: 100vh; position: relative; overflow-x: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0, var(--sky-mid) 520px, var(--sky-low) 100%);
  }
  .garland {
    position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 2; pointer-events: none;
    background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%2244%22 viewBox=%220 0 240 44%22%3E%3Cpath d=%22M0 5 Q30 27 60 5 Q90 27 120 5 Q150 27 180 5 Q210 27 240 5%22 stroke=%22%230C1745%22 stroke-width=%221.8%22 fill=%22none%22/%3E%3Ccircle cx=%2230%22 cy=%2226%22 r=%2211%22 fill=%22%23FF4D63%22 opacity=%22.28%22/%3E%3Crect x=%2227.4%22 y=%2215%22 width=%225.2%22 height=%225%22 rx=%221%22 fill=%22%230C1745%22/%3E%3Cellipse cx=%2230%22 cy=%2226%22 rx=%224.6%22 ry=%226.4%22 fill=%22%23FF4D63%22/%3E%3Cellipse cx=%2228.6%22 cy=%2223.8%22 rx=%221.1%22 ry=%221.9%22 fill=%22%23fff%22 opacity=%22.65%22/%3E%3Ccircle cx=%2290%22 cy=%2226%22 r=%2211%22 fill=%22%23FFC83D%22 opacity=%22.28%22/%3E%3Crect x=%2287.4%22 y=%2215%22 width=%225.2%22 height=%225%22 rx=%221%22 fill=%22%230C1745%22/%3E%3Cellipse cx=%2290%22 cy=%2226%22 rx=%224.6%22 ry=%226.4%22 fill=%22%23FFC83D%22/%3E%3Cellipse cx=%2288.6%22 cy=%2223.8%22 rx=%221.1%22 ry=%221.9%22 fill=%22%23fff%22 opacity=%22.65%22/%3E%3Ccircle cx=%22150%22 cy=%2226%22 r=%2211%22 fill=%22%2343D6CF%22 opacity=%22.28%22/%3E%3Crect x=%22147.4%22 y=%2215%22 width=%225.2%22 height=%225%22 rx=%221%22 fill=%22%230C1745%22/%3E%3Cellipse cx=%22150%22 cy=%2226%22 rx=%224.6%22 ry=%226.4%22 fill=%22%2343D6CF%22/%3E%3Cellipse cx=%22148.6%22 cy=%2223.8%22 rx=%221.1%22 ry=%221.9%22 fill=%22%23fff%22 opacity=%22.65%22/%3E%3Ccircle cx=%22210%22 cy=%2226%22 r=%2211%22 fill=%22%23FFFFFF%22 opacity=%22.28%22/%3E%3Crect x=%22207.4%22 y=%2215%22 width=%225.2%22 height=%225%22 rx=%221%22 fill=%22%230C1745%22/%3E%3Cellipse cx=%22210%22 cy=%2226%22 rx=%224.6%22 ry=%226.4%22 fill=%22%23FFFFFF%22/%3E%3Cellipse cx=%22208.6%22 cy=%2223.8%22 rx=%221.1%22 ry=%221.9%22 fill=%22%23fff%22 opacity=%22.65%22/%3E%3C/svg%3E") repeat-x top left / 240px 44px;
  }
  .snow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .snow i { position: absolute; left: 0; right: 0; top: -400px; bottom: 0; display: block; }
  .snow .s1 { background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22260%22 viewBox=%220 0 260 260%22%3E%3Ccircle cx=%2220%22 cy=%2230%22 r=%222.4%22 fill=%22%23fff%22 opacity=%220.9%22/%3E%3Ccircle cx=%2285%22 cy=%22120%22 r=%221.8%22 fill=%22%23fff%22 opacity=%220.7%22/%3E%3Ccircle cx=%22150%22 cy=%2260%22 r=%223%22 fill=%22%23fff%22 opacity=%220.85%22/%3E%3Ccircle cx=%22210%22 cy=%22190%22 r=%222%22 fill=%22%23fff%22 opacity=%220.8%22/%3E%3Ccircle cx=%2260%22 cy=%22220%22 r=%222.6%22 fill=%22%23fff%22 opacity=%220.8%22/%3E%3Ccircle cx=%22120%22 cy=%22160%22 r=%221.6%22 fill=%22%23fff%22 opacity=%220.6%22/%3E%3Ccircle cx=%22235%22 cy=%22100%22 r=%222.2%22 fill=%22%23fff%22 opacity=%220.75%22/%3E%3Ccircle cx=%22180%22 cy=%2210%22 r=%221.8%22 fill=%22%23fff%22 opacity=%220.7%22/%3E%3C/svg%3E") repeat; background-size: 260px 260px; animation: fall1 18s linear infinite; }
  .snow .s2 { background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22380%22 height=%22380%22 viewBox=%220 0 380 380%22%3E%3Ccircle cx=%2240%22 cy=%2270%22 r=%221.5%22 fill=%22%23fff%22 opacity=%220.55%22/%3E%3Ccircle cx=%22130%22 cy=%22200%22 r=%221.2%22 fill=%22%23fff%22 opacity=%220.5%22/%3E%3Ccircle cx=%22250%22 cy=%2230%22 r=%221.6%22 fill=%22%23fff%22 opacity=%220.55%22/%3E%3Ccircle cx=%22330%22 cy=%22160%22 r=%221.3%22 fill=%22%23fff%22 opacity=%220.5%22/%3E%3Ccircle cx=%2290%22 cy=%22320%22 r=%221.5%22 fill=%22%23fff%22 opacity=%220.5%22/%3E%3Ccircle cx=%22210%22 cy=%22280%22 r=%221.2%22 fill=%22%23fff%22 opacity=%220.45%22/%3E%3Ccircle cx=%22360%22 cy=%22330%22 r=%221.4%22 fill=%22%23fff%22 opacity=%220.5%22/%3E%3Ccircle cx=%22300%22 cy=%2290%22 r=%221.1%22 fill=%22%23fff%22 opacity=%220.45%22/%3E%3C/svg%3E") repeat; background-size: 380px 380px; animation: fall2 30s linear infinite; }
  @keyframes fall1 { to { transform: translateY(260px); } }
  @keyframes fall2 { to { transform: translateY(380px); } }

  .wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 58px 18px 0; }

  header {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 14px;
    grid-template-areas: "moon title tag";
  }
  .sky { grid-area: moon; width: 270px; margin: -6px 0 0 -6px; }
  .sky-art { display: block; width: 100%; height: auto; overflow: visible; }
  .title { grid-area: title; text-align: center; min-width: 0; }
  h1 {
    position: relative; display: inline-block; margin: 0; color: #fff;
    font: 400 clamp(1.8rem, 4vw, 3.3rem)/1.1 var(--display); letter-spacing: 0;
    text-shadow: 0 3px 0 rgba(10,20,70,.35), 0 0 24px rgba(255,226,122,.3);
  }
  .tag {
    grid-area: tag; position: relative; width: 112px; font-size: 16px; margin-right: -4px;
    transform: rotate(4deg); transform-origin: 50% 14%;
    filter: drop-shadow(0 6px 8px rgba(5,10,50,.38));
  }
  .tag-art { display: block; width: 100%; height: auto; overflow: visible; }
  .tag-text { position: absolute; left: 17%; right: 17%; top: 44%; text-align: center; color: #fff; line-height: 1; }
  .tag-text b { display: block; font: 400 2.5em/1 var(--display); text-shadow: 0 2px 0 rgba(110,10,30,.35); }
  .tag-text span { display: block; margin-top: .3em; font: 600 .74em/1.15 var(--body); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 26px; }
  .card {
    background: var(--paper); border: 3px solid #fff; border-radius: 24px; position: relative;
    display: flex; flex-direction: column; min-height: 230px;
    box-shadow: 0 10px 26px rgba(8,16,60,.38);
  }
  .head { border-radius: 21px 21px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 12px 14px; border-bottom: 2px solid var(--line); }
  .head .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ico { flex: none; width: 46px; height: 46px; display: inline-flex; align-items: center; justify-content: center; }
  .ico svg { width: 44px; height: 44px; }
  .head h2 { font: 400 1.5rem/1.1 var(--display); color: var(--navy); margin: 0; overflow-wrap: anywhere; }
  .round {
    flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--red);
    box-shadow: 0 2px 0 var(--red-dark); transition: transform .12s ease, background .12s ease;
  }
  .round svg { width: 22px; height: 22px; display: block; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .round:hover { background: var(--red-dark); }
  .round:active { transform: translateY(1px) scale(.96); }
  .round:disabled { opacity: .5; cursor: default; }
  .round.sm { width: 38px; height: 38px; box-shadow: none; background: #fff; color: var(--muted); border: 1.5px solid #E6D9B5; }
  .round.sm svg { width: 18px; height: 18px; }
  .round.sm:hover { background: var(--gold-soft); color: var(--ink); }
  .round.sm.del:hover { color: var(--red); }
  .round.sm.del.confirm { background: var(--red); color: #fff; border-color: var(--red); }
  .round.sm.ok { background: var(--pine); color: #fff; border-color: var(--pine); }
  .round.sm.ok:hover { background: var(--pine-dark); }
  .round.add-btn { width: 50px; height: 50px; }
  .round.add-btn svg { width: 26px; height: 26px; }
  ul { list-style: none; margin: 0; padding: 0 18px; flex: 1; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 2px dashed var(--line); }
  .gift { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .side { flex: none; display: flex; align-items: center; gap: 8px; }
  a.gift.link { color: var(--link); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: rgba(36,85,184,.45); }
  a.gift.link:hover { color: var(--link-dark); text-decoration-color: currentColor; }
  .side.col { flex-direction: column; }
  li.edit-row { align-items: flex-start; }
  li.edit-row .fields { flex: 1 1 0; min-width: 0; }
  li.edit-row input { min-height: 44px; }
  .fields .hint { margin-top: 6px; }

  .card.editing { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(247,190,62,.35), 0 10px 26px rgba(8,16,60,.38); }
  .card.editing .head { background: var(--gold-soft); border-bottom-color: #F2DDA0; }
  .card.editing li { border-bottom-color: #F2DDA0; }
  .card.editing .upd { background: var(--pine); box-shadow: 0 2px 0 var(--pine-dark); }
  .card.editing .upd:hover { background: var(--pine-dark); }
  form.add { border-radius: 0 0 21px 21px; display: none; padding: 14px 18px 18px; background: var(--gold-soft); }
  .card.editing form.add { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  form.add .fields { flex: 1 1 0; min-width: 0; }
  form.add .hint { flex-basis: 100%; margin: 0; }
  input[type=text], input[type=url] {
    width: 100%; min-height: 48px; padding: 10px 14px; font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1.5px solid #EBDDB0; border-radius: 12px;
  }
  input::placeholder { color: #8A94AD; }
  input:focus { outline: none; border-color: var(--red); }
  .fields input + input { margin-top: 8px; }
  .hint { margin: 8px 0 0; font-size: .88rem; color: var(--red); }
  .hint:empty { display: none; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .card :focus-visible { outline-color: var(--pine); }

  footer { position: relative; z-index: 1; margin-top: 30px; }
  .scene { display: flex; justify-content: center; padding: 0 8px; margin-bottom: -1px; }
  .scene-art { display: block; width: 100%; max-width: 760px; height: auto; overflow: visible; }
  .ground { background: var(--snow); padding: 4px 18px 26px; text-align: center; }
  .sync { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--pine); }
  .dot.off { background: var(--red); }

  .spark { position: absolute; display: block; width: var(--sz, 24px); height: var(--sz, 24px); pointer-events: none; z-index: 3; animation: tw 3.4s ease-in-out infinite; }
  .spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .spark-in { animation: tw 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tw { 0%, 100% { opacity: .5; transform: scale(.72) rotate(0deg); } 50% { opacity: 1; transform: scale(1.12) rotate(16deg); } }
  h1 .t1 { left: -20px; top: -10px; --sz: 32px; animation-delay: .2s; }
  h1 .t2 { left: 27%; top: -22px; --sz: 24px; animation-delay: 1.1s; }
  h1 .t3 { right: -18px; top: 0; --sz: 30px; animation-delay: .6s; }
  h1 .t4 { left: 66%; bottom: -15px; --sz: 20px; animation-delay: 1.7s; }
  .tag .sa { top: -4px; right: -12px; --sz: 30px; }
  .tag .sb { bottom: 16px; left: -14px; --sz: 22px; animation-delay: 1.2s; }
  .card .spark svg { filter: drop-shadow(0 0 1.5px #D8921A); }
  .card .pos-tr { top: -17px; right: 20px; }
  .card .pos-tl { top: -17px; left: 20px; }
  .card .pos-br { bottom: 12px; right: 14px; }
  .card .pos-bl { bottom: 12px; left: 14px; }

  @media (max-width: 879px) { .card { min-height: 150px; } }
  @media (max-width: 640px) {
    header { grid-template-columns: 1fr auto; grid-template-areas: "moon tag" "title title"; }
    .sky { width: 214px; margin-left: 0; }
    .tag { width: 94px; font-size: 13px; }
    h1 { font-size: clamp(2rem, 9vw, 2.6rem); }
  }
  @media (min-width: 880px) {
    .wrap { max-width: 1080px; padding-top: 60px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tag { animation: swing 7s ease-in-out infinite; }
  }
  @keyframes swing { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { .snow i, .spark, .spark-in { animation: none; } }
</style>
</head>

<script>
(function () {
  // >>> Adres wdrożenia z Apps Script (kończy się na /exec) <<<
  var API = 'https://script.google.com/macros/s/AKfycbwFtFDP4NiNgczQdENDltwLqUF94MiOvQ-dSZBwSN9TGBGOCGi7Jb1gp2bXac4GKlSM5w/exec';

  // Prostokąty istnieją od razu. Jeśli serwer zwróci inną listę osób (Code.gs), strona ją przejmie.
  var ICONS = ["tree", "star", "snowflake", "stocking", "gift", "cane", "elf", "bauble", "ginger"];
  var DEFAULT_PEOPLE = ['Tata', 'Mama', 'Ola', 'Tomek Piecha', 'Asia', 'Piotrek', 'Kacper', 'Iza', 'Tomek Bomek'];

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function errText(e) { return (e && e.message ? e.message : 'Coś poszło nie tak.').replace(/^Error:\s*/, ''); }
  function host(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; } }

  var people = DEFAULT_PEOPLE.slice(), items = [], editing = '', builtKey = '', lastItems = '', busy = false;
  function icon(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ic-' + name + '"/></svg>'; }
  function roundBtn(cls, iconName, label) {
    var b = el('button', 'round ' + cls); b.type = 'button';
    b.innerHTML = icon(iconName); b.setAttribute('aria-label', label); b.title = label;
    return b;
  }

  /* Odliczanie do Wigilii */
  (function () {
    var now = new Date(), y = now.getFullYear();
    var today = new Date(y, now.getMonth(), now.getDate());
    var target = new Date(y, 11, 24);
    if (today > target) target = new Date(y + 1, 11, 24);
    var d = Math.round((target - today) / 86400000);
    if (d === 0) { $('days').textContent = '🎄'; $('daysLabel').textContent = 'Dziś Wigilia!'; return; }
    $('days').textContent = d;
    $('daysLabel').textContent = (d === 1 ? 'dzień' : 'dni') + ' do Wigilii';
  })();

  /* Komunikacja z serwerem (bez ciasteczek, więc liczba zalogowanych kont Google nie ma znaczenia) */
  function api(params) {
    if (API.indexOf('https://') !== 0) return Promise.reject(new Error('Brak adresu serwera. Uzupełnij zmienną API w pliku index.html.'));
    var q = new URLSearchParams(params);
    q.set('_', Date.now());
    return fetch(API + '?' + q.toString(), { method: 'GET', credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.error) throw new Error(d.error); return d; });
  }
  function setSync(ok, text) {
    $('dot').className = 'dot ' + (ok ? 'ok' : 'off');
    $('syncText').textContent = text;
  }

  function apply(d) {
    var np = (d.people && d.people.length) ? d.people : people;
    var key = np.join('|');
    var rebuilt = false;
    if (key !== builtKey) {
      people = np; builtKey = key;
      if (editing && people.indexOf(editing) < 0) editing = '';
      buildAll(); rebuilt = true;
    }
    var json = JSON.stringify(d.items || []);
    if (rebuilt || json !== lastItems) { lastItems = json; items = d.items || []; fillLists(); }
  }

  function refresh() {
    if (busy) return;
    api({ action: 'list' }).then(function (d) {
      if (busy) return;
      apply(d); setSync(true, 'Zsynchronizowano');
    }).catch(function (e) {
      setSync(false, /^Brak adresu/.test(errText(e)) ? errText(e) : 'Brak połączenia. Próbuję ponownie…');
    });
  }

  /* Prostokąty */
  function cards() { return Array.prototype.slice.call($('grid').children); }

  function buildAll() {
    var grid = $('grid');
    grid.textContent = '';
    people.forEach(function (n, i) { grid.appendChild(card(n, i)); });
    syncEditUI();
  }

  var SPARKS = { 0: [['tr', 1]], 1: [['tl', .8]], 2: [['br', 1.1], ['tr', .7]], 3: [['bl', .9]], 4: [['tr', 1]], 5: [['bl', 1.1], ['br', .7]], 6: [['tl', 1]], 7: [['br', .9]], 8: [['tr', 1.1]] };
  function addSparks(c, idx) {
    (SPARKS[idx % 9] || []).forEach(function (s, i) {
      var n = el('span', 'spark pos-' + s[0]);
      n.style.setProperty('--sz', Math.round(24 * s[1]) + 'px');
      n.style.animationDelay = (idx * 0.37 + i * 0.9).toFixed(2) + 's';
      n.setAttribute('aria-hidden', 'true');
      n.innerHTML = '<svg viewBox="-12 -12 24 24" focusable="false"><use href="#spark"/></svg>';
      c.appendChild(n);
    });
  }
  var editItemId = '', draft = { gift: '', link: '' };

  function card(name, idx) {
    var c = el('section', 'card');
    c.setAttribute('data-who', name);
    var head = el('div', 'head');
    var who = el('div', 'who');
    var ico = el('span', 'ico');
    ico.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="#i-' + ICONS[idx % ICONS.length] + '"/></svg>';
    who.appendChild(ico);
    who.appendChild(el('h2', null, name));
    head.appendChild(who);
    var btn = roundBtn('upd', 'pencil', 'Edytuj listę: ' + name);
    btn.addEventListener('click', function () { toggleEdit(name); });
    head.appendChild(btn);
    c.appendChild(head);
    c.appendChild(el('ul'));
    c.appendChild(form(name));
    addSparks(c, idx);
    return c;
  }

  function syncEditUI() {
    cards().forEach(function (c) {
      var nm = c.getAttribute('data-who');
      var on = nm === editing;
      c.classList.toggle('editing', on);
      var b = c.querySelector('.upd');
      b.innerHTML = icon(on ? 'check' : 'pencil');
      var lab = on ? 'Zakończ edycję listy: ' + nm : 'Edytuj listę: ' + nm;
      b.setAttribute('aria-label', lab); b.title = lab;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function toggleEdit(name) {
    editing = (editing === name) ? '' : name;
    editItemId = '';
    syncEditUI();
    fillLists();
    if (editing) {
      var inp = document.querySelector('.card.editing form.add input');
      if (inp) inp.focus();
    }
  }

  function form(name) {
    var f = el('form', 'add'); f.setAttribute('autocomplete', 'off'); f.noValidate = true;
    var fields = el('div', 'fields');
    var g = el('input'); g.type = 'text'; g.maxLength = 120; g.placeholder = 'Pomysł na prezent'; g.setAttribute('aria-label', 'Pomysł na prezent dla: ' + name);
    var l = el('input'); l.type = 'url'; l.maxLength = 300; l.placeholder = 'Link (opcjonalnie)'; l.setAttribute('aria-label', 'Link do sklepu, opcjonalnie'); l.setAttribute('inputmode', 'url');
    fields.appendChild(g); fields.appendChild(l);
    var b = roundBtn('add-btn', 'plus', 'Dodaj do listy'); b.type = 'submit';
    var h = el('p', 'hint'); h.setAttribute('role', 'status');
    f.appendChild(fields); f.appendChild(b); f.appendChild(h);
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var gift = g.value.trim();
      if (!gift) { h.textContent = 'Wpisz pomysł na prezent.'; g.focus(); return; }
      if (busy) return;
      h.textContent = ''; b.disabled = true;
      busy = true;
      api({ action: 'add', who: name, gift: gift, link: l.value.trim() }).then(function (d) {
        busy = false; g.value = ''; l.value = ''; apply(d); setSync(true, 'Zsynchronizowano'); g.focus();
      }).catch(function (e) {
        busy = false; h.textContent = errText(e);
      }).then(function () { b.disabled = false; });
    });
    return f;
  }

  function fillLists() {
    if (editItemId && !items.some(function (i) { return i.id === editItemId; })) editItemId = '';
    var act = document.activeElement, field = null, pos = null;
    if (act && act.getAttribute && act.getAttribute('data-edit-field')) {
      field = act.getAttribute('data-edit-field');
      try { pos = [act.selectionStart, act.selectionEnd]; } catch (e) {}
    }
    cards().forEach(function (c) {
      var name = c.getAttribute('data-who');
      var edit = name === editing;
      var ul = c.querySelector('ul');
      ul.textContent = '';
      items.filter(function (i) { return i.who === name; }).forEach(function (it) {
        ul.appendChild(edit && it.id === editItemId ? editRow(it, name) : row(it, edit, name));
      });
    });
    if (field) {
      var n = document.querySelector('[data-edit-field="' + field + '"]');
      if (n) { n.focus(); if (pos) { try { n.setSelectionRange(pos[0], pos[1]); } catch (e) {} } }
    }
  }

  function row(it, edit, name) {
    var li = el('li');
    var g;
    if (/^https?:\/\//i.test(it.link)) {
      g = el('a', 'gift link', it.gift);
      g.href = it.link; g.target = '_blank'; g.rel = 'noopener noreferrer'; g.title = host(it.link);
    } else {
      g = el('div', 'gift', it.gift);
    }
    li.appendChild(g);
    if (edit) {
      var side = el('div', 'side');
      var ed = roundBtn('sm', 'pencil', 'Edytuj pomysł: ' + it.gift);
      ed.addEventListener('click', function () {
        editItemId = it.id; draft = { gift: it.gift, link: it.link || '' };
        fillLists();
        var n = document.querySelector('[data-edit-field="gift"]'); if (n) n.focus();
      });
      var del = roundBtn('sm del', 'trash', 'Usuń pomysł: ' + it.gift);
      var armed = false, t;
      del.addEventListener('click', function () {
        if (!armed) {
          armed = true; del.classList.add('confirm');
          var sure = 'Na pewno? Kliknij jeszcze raz, żeby usunąć';
          del.setAttribute('aria-label', sure); del.title = sure;
          t = setTimeout(function () {
            armed = false; del.classList.remove('confirm');
            var l0 = 'Usuń pomysł: ' + it.gift; del.setAttribute('aria-label', l0); del.title = l0;
          }, 3000);
          return;
        }
        clearTimeout(t);
        if (busy) return;
        busy = true;
        api({ action: 'delete', who: name, id: it.id }).then(function (d) {
          busy = false; apply(d); setSync(true, 'Zsynchronizowano');
        }).catch(function (e) { busy = false; setSync(false, errText(e)); });
      });
      side.appendChild(ed); side.appendChild(del);
      li.appendChild(side);
    }
    return li;
  }

  function editRow(it, name) {
    var li = el('li', 'edit-row');
    var fields = el('div', 'fields');
    var g = el('input'); g.type = 'text'; g.maxLength = 120; g.value = draft.gift; g.placeholder = 'Pomysł na prezent';
    g.setAttribute('aria-label', 'Pomysł na prezent'); g.setAttribute('data-edit-field', 'gift');
    var l = el('input'); l.type = 'url'; l.maxLength = 300; l.value = draft.link; l.placeholder = 'Link (opcjonalnie)';
    l.setAttribute('aria-label', 'Link do sklepu, opcjonalnie'); l.setAttribute('inputmode', 'url'); l.setAttribute('data-edit-field', 'link');
    var hint = el('p', 'hint'); hint.setAttribute('role', 'status');
    fields.appendChild(g); fields.appendChild(l); fields.appendChild(hint);
    g.addEventListener('input', function () { draft.gift = g.value; hint.textContent = ''; });
    l.addEventListener('input', function () { draft.link = l.value; });

    var acts = el('div', 'side col');
    var ok = roundBtn('sm ok', 'check', 'Zapisz zmiany');
    var no = roundBtn('sm', 'x', 'Anuluj edycję');
    function cancel() { editItemId = ''; fillLists(); }
    function save() {
      var gift = draft.gift.trim();
      if (!gift) { hint.textContent = 'Wpisz pomysł na prezent.'; g.focus(); return; }
      if (busy) return;
      busy = true; ok.disabled = true;
      api({ action: 'update', who: name, id: it.id, gift: gift, link: draft.link.trim() }).then(function (d) {
        busy = false; editItemId = ''; apply(d); fillLists(); setSync(true, 'Zsynchronizowano');
      }).catch(function (e) {
        busy = false; ok.disabled = false; hint.textContent = errText(e);
      });
    }
    ok.addEventListener('click', save);
    no.addEventListener('click', cancel);
    [g, l].forEach(function (inp) {
      inp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); save(); }
        else if (ev.key === 'Escape') { cancel(); }
      });
    });
    acts.appendChild(ok); acts.appendChild(no);
    li.appendChild(fields); li.appendChild(acts);
    return li;
  }

  builtKey = people.join('|');
  buildAll();
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 10000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
